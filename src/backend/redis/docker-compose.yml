name: kickzo

services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "${REDIS_HOST_PORT}:${REDIS_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - kickzo-network
    volumes:
      - redis:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    ports:
      - "${REDIS_INSIGHT_PORT}:${REDIS_INSIGHT_CONTAINER_PORT}"
    volumes:
      - redisinsight:/db
    networks:
      - kickzo-network

volumes:
  redis:
  redisinsight:

networks:
  kickzo-network:
    driver: bridge
