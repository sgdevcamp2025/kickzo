name: kickzo

services:
  kibana:
    image: docker.elastic.co/kibana/kibana:8.5.0
    container_name: kibana
    ports:
      - "${KIBANA_PORT}:${KIBANA_PORT}"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kickzo
      ELASTICSEARCH_PASSWORD: test123
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - kickzo-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://localhost:5601/app/home | grep -q '200 OK'",
        ]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 30s

volumes:
  es-data:

networks:
  kickzo-network:
    driver: bridge
