name: kickzo

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.0
    container_name: elasticsearch
    ports:
      - "${ELASTIC_PORT}:${ELASTIC_PORT}"
    environment:
      - discovery.type=single-node # 단일 노드로 실행
      - xpack.security.enabled=true
      - bootstrap.memory_lock=true # 메모리 잠금 활성화
      - ES_JAVA_OPTS=-Xms512m -Xmx512m # Elasticsearch JVM 메모리 설정
      - ELASTIC_USERNAME=elastic
      - ELASTIC_PASSWORD=test123
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./elasticsearch-init.sh:/usr/share/elasticsearch/init.sh
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "/usr/share/elasticsearch/init.sh & /usr/local/bin/docker-entrypoint.sh",
      ]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - kickzo-network
    # ARM64 아키텍처 문제 해결을 위한 플랫폼 지정
    platform: linux/amd64
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -s http://localhost:9200/_cluster/health | grep -vq ''"status":"red"''',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  es-data:

networks:
  kickzo-network:
    driver: bridge
