<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #messages {
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
            background-color: #f9f9f9;
        }
        input, button {
            padding: 10px;
            margin: 5px 0;
            font-size: 16px;
        }
        #status {
            margin-top: 10px;
            font-weight: bold;
        }
        .message {
            padding: 5px;
            border-bottom: 1px solid #ddd;
        }
        .message .time {
            font-size: 0.8em;
            color: gray;
        }
    </style>
</head>
<body>

<h1>Group Chat</h1>

<!-- User ID 입력 -->
<div>
    <input type="text" id="userIdInput" placeholder="Enter your User ID" />
    <button onclick="connect()">Connect</button>
</div>

<div id="roomButtons" style="display: none;">
    <h2>Select a Room:</h2>
    <button onclick="subscribeToRoom(1)">Join Room 1</button>
    <button onclick="subscribeToRoom(2)">Join Room 2</button>
    <button onclick="subscribeToRoom(3)">Join Room 3</button>
</div>

<div id="chatSection" style="display: none;">
    <h2>Room Chat</h2>
    <div id="messages"></div>
    <input type="text" id="messageInput" placeholder="Enter your message" />
    <button onclick="sendMessage()">Send</button>
    <button onclick="sendPlaylistTime(12)">Send Playlist Time (12 sec)</button>
</div>

<div id="status">Status: Disconnected</div>

<script>
    let stompClient = null;
    let userId = '';
    let roomId = null;

    function connect() {
        userId = document.getElementById('userIdInput').value.trim();
        if (!userId) {
            alert('Please enter your User ID');
            return;
        }

        const socket = new SockJS('/api/chat/ws');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, () => {
            console.log('Connected as User:', userId);
            document.getElementById('status').textContent = 'Status: Connected';
            document.getElementById('roomButtons').style.display = 'block';
            // 방 참여 메시지 전송
            stompClient.send('/app/connect', {}, JSON.stringify({
                userId: userId
            }));
            }, (error) => {
            console.error('Connection error:', error);
            document.getElementById('status').textContent = 'Status: Connection Failed';
        });

    }

    function subscribeToRoom(selectedRoomId) {
        if (!stompClient) {
            alert('You must connect first!');
            return;
        }

        roomId = selectedRoomId;
        document.getElementById('chatSection').style.display = 'block';
        document.getElementById('messages').innerHTML = ''; // 기존 메시지 지우기
        console.log(`Subscribed to room ${roomId}`);

        stompClient.subscribe(`/topic/user/${userId}/friend-state`, (message) => {
            const payload = JSON.parse(message.body);
            showMessage(payload.message, payload.userId);
        });
        stompClient.subscribe(`/topic/user/${userId}/notification`, (message) => {
            const payload = JSON.parse(message.body);
            showMessage(payload.message, payload.userId);
        });

        stompClient.subscribe(`/topic/room/${roomId}`, (message) => {
            const payload = JSON.parse(message.body);
            showMessage(payload.message, payload.userId);
        });
        stompClient.subscribe(`/topic/room/${roomId}/user-info`, (message) => {
            const payload = JSON.parse(message.body);
            showMessage(payload.message, payload.userId);
        });
        stompClient.subscribe(`/topic/room/${roomId}/room-update`, (message) => {
            const payload = JSON.parse(message.body);
            showMessage(payload.message, payload.userId);
        });
        stompClient.subscribe(`/topic/room/${roomId}/role-change`, (message) => {
            const payload = JSON.parse(message.body);
            showMessage(payload.message, payload.userId);
        });
        stompClient.subscribe(`/topic/room/${roomId}/playlist-update`, (message) => {
            const payload = JSON.parse(message.body);
            showMessage(payload.message, payload.userId);
        });
        stompClient.subscribe(`/topic/room/${roomId}/play-time`, (message) => {
            const payload = JSON.parse(message.body);
            showMessage(payload.message, payload.userId);
        });
        stompClient.subscribe(`/topic/room/${roomId}/chat`, (message) => {
            const payload = JSON.parse(message.body);
            showMessage(payload.message, payload.userId);
        });
    }

    function sendMessage() {
        const message = document.getElementById('messageInput').value.trim();
        if (!message || !roomId) {
            alert('Enter a message and select a room');
            return;
        }

        const payload = JSON.stringify({
            roomId: roomId,
            userId: userId,
            message: message
        });

        stompClient.send('/app/sendMessage', {}, payload);
        document.getElementById('messageInput').value = '';
        console.log('Sent message:', payload);
    }

    function sendPlaylistTime(playlistTime) {
        if (stompClient && stompClient.connected) {
            const payload = JSON.stringify({
                roomId: roomId,
                playlistTime: playlistTime
            });
            stompClient.send('/app/play-time', {}, payload);
            console.log('Sent playlistTime:', payload);
        } else {
            console.error('WebSocket not connected.');
        }
    }

    function showMessage(message, sender) {
        const messagesDiv = document.getElementById('messages');
        const messageElement = document.createElement('div');
        messageElement.classList.add('message');

        const timeElement = document.createElement('span');
        timeElement.classList.add('time');
        timeElement.textContent = ` [${new Date().toLocaleTimeString()}] `;

        messageElement.textContent = `${sender}: ${message}`;
        messageElement.prepend(timeElement);
        messagesDiv.appendChild(messageElement);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
</script>
</body>
</html>
