<!DOCTYPE html>
<html>
<head>
    <title>Group Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        #messages {
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
            background-color: #f9f9f9;
        }
        #messageInput {
            width: 300px;
            padding: 10px;
            margin-right: 10px;
        }
        button {
            padding: 10px;
            margin-right: 5px;
            cursor: pointer;
        }
        #status {
            margin-top: 10px;
            font-weight: bold;
        }
        .message {
            padding: 5px;
            border-bottom: 1px solid #ddd;
        }
        .message .time {
            font-size: 0.8em;
            color: gray;
        }
    </style>
</head>
<body>
<h1>Group Chat</h1>

<div id="messages"></div>

<div>
    <input type="text" id="messageInput" placeholder="Enter your message" />
    <button onclick="sendMessage()">Send</button>
</div>

<div>
    <button id="connectBtn" onclick="connect()">Connect</button>
    <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
</div>

<div id="status">Status: Disconnected</div>

<script>
    let stompClient = null;
    let userId = 1;  // 숫자로 변경
    let roomId = 1;  // 숫자로 변경

    function connect() {
        const socket = new SockJS('/api/chat/ws');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, () => {
            console.log('Connected');
            document.getElementById('status').textContent = 'Status: Connected';

            // 버튼 상태 변경
            document.getElementById('connectBtn').disabled = true;
            document.getElementById('disconnectBtn').disabled = false;

            stompClient.subscribe(`/topic/${roomId}`, (message) => {
                console.log('Received WebSocket message:', message.body);
                const payload = JSON.parse(message.body);

                if (typeof payload === 'string') {
                    showMessage(payload, 'system');
                } else {
                    showMessage(payload.message, payload.userId);
                }
            });

            // 방 참여 메시지 전송
            stompClient.send('/app/joinRoom', {}, JSON.stringify({
                roomId: roomId,
                userId: userId
            }));
        }, (error) => {
            console.error('Connection error:', error);
            document.getElementById('status').textContent = 'Status: Connection Failed';

            // 자동 재연결 (예: 3초 후 재시도)
            setTimeout(connect, 3000);
        });
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect();
        }
        document.getElementById('status').textContent = 'Status: Disconnected';
        console.log('Disconnected');

        // 버튼 상태 변경
        document.getElementById('connectBtn').disabled = false;
        document.getElementById('disconnectBtn').disabled = true;
    }

    function sendMessage() {
        const message = document.getElementById('messageInput').value.trim();
        if (message === '') {
            return; // 빈 메시지 전송 방지
        }

        stompClient.send('/app/sendMessage', {}, JSON.stringify({
            roomId: roomId,
            userId: userId,
            message: message
        }));

        // 메시지 전송 후 입력 필드 비우기
        document.getElementById('messageInput').value = '';
        document.getElementById('messageInput').focus();
    }

    function showMessage(message, sender) {
        const messagesDiv = document.getElementById('messages');
        const messageElement = document.createElement('div');
        messageElement.classList.add('message');

        const timeElement = document.createElement('span');
        timeElement.classList.add('time');
        timeElement.textContent = ` [${new Date().toLocaleTimeString()}] `;

        if (sender === userId) {
            messageElement.textContent = `${sender}: ${message}`;
            messageElement.style.color = 'blue';
        } else if (sender === 'system') {
            messageElement.textContent = `System: ${message}`;
            messageElement.style.color = 'gray';
        } else {
            messageElement.textContent = `${sender}: ${message}`;
            messageElement.style.color = 'green';
        }

        messageElement.prepend(timeElement);
        messagesDiv.appendChild(messageElement);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
</script>
</body>
</html>
